# mpv discord rich presence configuration

# discord application client id
client_id=1462038267183628308

# discord activity types
# 2 = LISTENING ("Слушает...") for music/audio
# 3 = WATCHING  ("Смотрит...")  for video/movies/series
activity_type_video=3
activity_type_audio=2

# fetch poster and cover artwork from imdb and itunes (yes/no)
fetch_cover_art=yes

# enable imdb search for movies and tv series (yes/no)
enable_imdb=yes

# enable soft search for messy filenames and stream titles (yes/no)
imdb_soft_search=yes

# show playlist position and total file count (yes/no)
show_playlist_pos=yes

# enable torrserver url parsing and streaming playlist support (yes/no)
torrserver_support=yes

# update interval in seconds
update_interval=2

# interface language: en or ru
language=en

# show action buttons in discord activity (yes/no)
show_buttons=yes

# active state when playback is paused (yes/no)
active_when_paused=yes

# default asset keys
large_image_default=mpv
large_image_audio=music_note
small_image_play=play
small_image_pause=pause
